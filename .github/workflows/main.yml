                              Wrap(
                                spacing: 10,
                                children: [
                                  ElevatedButton.icon(
                                    icon: const Icon(Icons.edit_document),
                                    label: const Text('Add Text'),
                                    onPressed: () => _showAddTextDialog(_currentPdfFile!),
                                  ),
                                  ElevatedButton.icon(
                                    icon: const Icon(Icons.draw),
                                    label: const Text('Sign PDF'),
