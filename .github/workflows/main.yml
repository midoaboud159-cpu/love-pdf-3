name: Build Windows & Android Releases

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare & Build Android APK
        run: |
          # إذا تم رفع الملف مضغوطاً، سيقوم بفك ضغطه تلقائياً
          if [ -f "DocuMaster-Pro-GitHub-v2.zip" ]; then
            unzip -o DocuMaster-Pro-GitHub-v2.zip
          fi

          # الدخول إلى مجلد التطبيق
          if [ -d "frontend-flutter" ]; then
            cd frontend-flutter
          elif [ -d "DocuMaster-Pro-v2/frontend-flutter" ]; then
            cd DocuMaster-Pro-v2/frontend-flutter
          fi

          # الاحتفاظ بالكود المحدث قبل تهيئة ملفات النظام
          cp lib/main.dart main.dart.bak
          
          flutter create --platforms=android --org com.documaster.app .
          
          # استرجاع الكود وتثبيت كافة حزم السحب والإفلات ومعالجة الـ PDF
          mv main.dart.bak lib/main.dart
          flutter pub add file_picker http syncfusion_flutter_pdfviewer syncfusion_flutter_pdf desktop_drop signature path_provider
          
          flutter build apk --release
          
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/DocuMaster-Pro.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DocuMaster-Pro-Android-APK
          path: DocuMaster-Pro.apk

  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare & Build Windows EXE
        shell: bash
        run: |
          if [ -f "DocuMaster-Pro-GitHub-v2.zip" ]; then
            unzip -o DocuMaster-Pro-GitHub-v2.zip
          fi

          if [ -d "frontend-flutter" ]; then
            cd frontend-flutter
          elif [ -d "DocuMaster-Pro-v2/frontend-flutter" ]; then
            cd DocuMaster-Pro-v2/frontend-flutter
          fi

          cp lib/main.dart main.dart.bak
          
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          
          mv main.dart.bak lib/main.dart
          flutter pub add file_picker http syncfusion_flutter_pdfviewer syncfusion_flutter_pdf desktop_drop signature path_provider
          
          flutter build windows --release
          
          mkdir -p $GITHUB_WORKSPACE/windows-release
          cp -r build/windows/x64/runner/Release/* $GITHUB_WORKSPACE/windows-release/

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DocuMaster-Pro-Windows-PC
          path: windows-release/
